<!DOCTYPE html>
<html>
<head>
    <title>My First Blog</title>
</head>
<body style="font-family: Arial; margin: 20px; background: #f4f4f4;">
    <div style="max-width: 800px; margin: auto; background: white; padding: 20px;">
        <nav>
            <a href="{% url 'home' %}">Home</a> |
            {% if user.is_authenticated %}
                <a href="{% url 'create_post' %}">New Post</a> |
                <a href="{% url 'my_posts' %}">My Posts</a> |
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a> |
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
        <hr>
        {% for message in messages %}<p style="color:green;">{{ message }}</p>{% endfor %}
        
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
