{% extends 'blog/base.html' %}
{% block content %}
<h1>{{ post.title }}</h1>
<p>By {{ post.author }} | {{ post.created_at|date:"d M Y" }}</p>
{% if post.image %}<img src="{{ post.image.url }}" width="400">{% endif %}
<p>{{ post.content }}</p>
{% if user == post.author %}
    <a href="{% url 'edit_post' post.pk %}">Edit</a> | 
    <a href="{% url 'delete_post' post.pk %}">Delete</a>
{% endif %}
{% endblock %}
